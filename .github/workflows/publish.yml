name: Publish to npm

# Triggered by a new vX.Y.Z tag (created automatically by auto-tag.yml when
# package.json version changes on main).  Idempotent: skips silently if the
# version already exists on npm, so accidental re-tags are safe reruns.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance attestation via OIDC Trusted Publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.1.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check if version already published
        id: check
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@tiny-owl-kit/observability@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          # Supports both npm Trusted Publishing (OIDC) and NPM_TOKEN fallback.
          # For OIDC: set up Trusted Publishing on npmjs.com → no secret needed.
          # For token fallback: add NPM_TOKEN (automation token) as a GH secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip (already published)
        if: steps.check.outputs.published == 'true'
        run: echo "v${{ steps.check.outputs.version }} already exists on npm — skipping publish."
