name: Release

# On every push to main that touches package.json: read the version, skip if the
# tag already exists (no-op for bumps that haven't changed version), otherwise
# run tests + build, create the git tag, and publish to npm — all in one job.
#
# Why one job: GitHub Actions does not trigger downstream workflows when
# GITHUB_TOKEN pushes a tag, so the old auto-tag → publish.yml chain never fired.

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write # create + push the git tag
  id-token: write # npm provenance attestation via OIDC

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (version unchanged)
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "Tag ${{ steps.tag_check.outputs.tag }} already exists — version unchanged, skipping release."

      - name: Setup Node.js
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.1.0
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.tag_check.outputs.exists == 'false'
        run: npm ci

      - name: Run tests
        if: steps.tag_check.outputs.exists == 'false'
        run: npm test

      - name: Build
        if: steps.tag_check.outputs.exists == 'false'
        run: npm run build

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.tag_check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Check if version already published to npm
        if: steps.tag_check.outputs.exists == 'false'
        id: npm_check
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "@tiny-owl-kit/observability@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.tag_check.outputs.exists == 'false' && steps.npm_check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          # NPM_TOKEN (automation token) or OIDC Trusted Publishing — both supported.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip (version already on npm)
        if: steps.tag_check.outputs.exists == 'false' && steps.npm_check.outputs.published == 'true'
        run: echo "v${{ steps.pkg.outputs.version }} already exists on npm — skipping publish."
