name: Release

# On every push to main that touches package.json: read the version, then:
#   - tag exists + npm published  → skip (no-op)
#   - tag exists + npm NOT published → retry publish only (handles failed publish)
#   - tag missing                 → full flow: test → build → tag → publish
#
# Why one job: GitHub Actions does not trigger downstream workflows when
# GITHUB_TOKEN pushes a tag, so the old auto-tag → publish.yml chain never fired.

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch: # allow manual trigger (e.g. to retry a failed publish)

permissions:
  contents: write # create + push the git tag
  id-token: write # npm provenance attestation (requires id-token even with NPM_TOKEN)

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if version already published to npm
        id: npm_check
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "@tiny-owl-kit/observability@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (tag exists and already on npm)
        if: steps.tag_check.outputs.exists == 'true' && steps.npm_check.outputs.published == 'true'
        run: echo "v${{ steps.pkg.outputs.version }} is tagged and on npm — nothing to do."

      # Everything below is skipped when both tag and npm are already done.

      - name: Setup Node.js
        if: steps.npm_check.outputs.published == 'false'
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.1.0
        with:
          node-version: 24 # OIDC trusted publishing needs Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports OIDC trusted publishing
        if: steps.npm_check.outputs.published == 'false'
        run: npm install -g npm@latest # trusted publishing requires npm CLI >= 11.5.1

      - name: Install dependencies
        if: steps.npm_check.outputs.published == 'false'
        run: npm ci

      - name: Run tests
        if: steps.tag_check.outputs.exists == 'false'
        run: npm test

      - name: Build
        if: steps.tag_check.outputs.exists == 'false'
        run: npm run build

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.tag_check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish to npm
        if: steps.npm_check.outputs.published == 'false'
        # npm >= 11.5.1 detects the GitHub OIDC environment and authenticates via
        # the trusted publisher automatically; provenance is generated by default.
        run: npm publish --access public

      - name: Skip (already on npm)
        if: steps.npm_check.outputs.published == 'true' && steps.tag_check.outputs.exists == 'false'
        run: echo "v${{ steps.pkg.outputs.version }} already on npm — tag created, skipping publish."
